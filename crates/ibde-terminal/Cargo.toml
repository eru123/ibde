[package]
name = "ibde-terminal"
description = "IBDE flagship terminal — emulation core: vte parser feeding ibde-ui's TextGrid (ADR-0011)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ibde-ui.workspace = true
vte.workspace = true
portable-pty.workspace = true
cairo-rs.workspace = true
pango.workspace = true
libc.workspace = true

[[bin]]
name = "ibde-terminal"
path = "src/bin/ibde-terminal.rs"

[package.metadata.deb]
maintainer = "IBDE project <jericho@skiddph.com>"
copyright = "2026, IBDE project"
extended-description = """The IBDE flagship terminal: vte-based emulation rendered through the
ibde-ui text-grid fast path (glyph atlas, damage tracking) — built for
floor hardware where VTE+GTK is not affordable."""
depends = "libcairo2, libpangocairo-1.0-0, libwayland-client0, libxkbcommon0, libc6"
section = "x11"
priority = "optional"

