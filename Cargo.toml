[workspace]
resolver = "2"
members = [
    "crates/ibde-ui",
    "crates/ibde-terminal",
    "crates/ibde-shell",
    "ui/spike-rs",
    "tools/kb-inject",
    "tools/ptr-inject",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eru123/ibde"

[workspace.dependencies]
ibde-ui = { path = "crates/ibde-ui" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
memmap2 = "0.9"
libc = "0.2"
vte = "0.13"
portable-pty = "0.8"
xkbcommon = "0.8"
zbus = "5"

[profile.release]
lto = "thin"
