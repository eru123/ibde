[package]
name = "ibde-spike"
version = "0.1.0"
edition = "2021"
description = "IBDE Phase 0 toolkit spike, Rust edition (ADR-0012) — mirrors ui/spike/spike.c"
license = "Apache-2.0"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
lto = "thin"
